<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' shape-rendering='crispEdges'><rect x='7' y='3' width='21' height='26' fill='%232457d6' stroke='%23000'/><rect x='12' y='8' width='12' height='7' fill='%23fff' stroke='%23000'/><path d='M3 7h7M3 11h7M3 15h7M3 19h7M3 23h7' stroke='%23808080' stroke-width='2'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=PT+Mono&family=Pixelify+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="/style.css">{{head_extra}}
</head>
<body>
<div class="desktop">
  <nav class="icons" aria-label="Desktop">
    {{desktop_icons}}
  </nav>
  <main>
{{content}}
  </main>
</div>

<div class="start-menu" id="start-menu" hidden>
  <div class="start-banner"><span>{{site_title}}</span></div>
  <ul>
      {{start_menu}}
  </ul>
</div>

<footer class="taskbar">
  <button class="btn start" type="button" aria-expanded="false" aria-controls="start-menu">{{start_icon}}<b>Start</b></button>
  <div class="tasks">{{task}}</div>
  <div class="tray" title="updated {{updated}}"><time id="clock"></time></div>
</footer>

<script>
(function () {
  var button = document.querySelector(".start"), menu = document.getElementById("start-menu");
  function setMenu(open) {
    menu.hidden = !open;
    button.setAttribute("aria-expanded", open);
    button.classList.toggle("pressed", open);
  }
  button.addEventListener("click", function (e) { e.stopPropagation(); setMenu(menu.hidden); });
  document.addEventListener("click", function (e) { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") return setMenu(false);
    if (e.altKey || e.ctrlKey || e.metaKey || /input|textarea/i.test(e.target.tagName)) return;
    var rel = e.key === "ArrowLeft" ? "prev" : e.key === "ArrowRight" ? "next" : null;
    var link = rel && document.querySelector('.pager a[rel="' + rel + '"]');
    if (link) location.href = link.href;
  });
  var clock = document.getElementById("clock");
  function tick() { clock.textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  tick();
  setInterval(tick, 15000);
})();
</script>
{{body_extra}}
</body>
</html>
